name: Orangefit ADD-feed

# Alle productinfo (teksten, afbeeldingen, varianten) om met Stock Sync NIEUWE
# producten aan te maken. 1x per week -- nieuwe producten verschijnen niet vaak.
on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies installeren
        run: pip install -r requirements.txt
      - name: ADD-feed scraper draaien
        run: python add_scraper.py
      # Ook de update-feed meenemen, zodat de test de SKU's van beide feeds kan
      # vergelijken zonder te struikelen over een update-feed van gisteravond.
      - name: UPDATE-feed meenemen
        run: python scraper.py
      # Toetst ook of er geen Trustpilot, Repeat, bezorgbelofte of contactgegevens
      # van Orangefit in de teksten zijn blijven staan. Faalt dit, dan geen commit.
      - name: Invarianten toetsen
        run: python test_feed.py
      - name: XML committen en pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add orangefit_add_feed.xml orangefit_add_feed_plat.xml orangefit_feed.xml orangefit_overgeslagen.csv orangefit_geschrapt.csv orangefit_tekstbron.csv orangefit_telling.json orangefit_variantfotos.csv
          git diff --staged --quiet || git commit -m "ADD-feed bijgewerkt: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
